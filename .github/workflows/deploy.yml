name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # react-router build (client + ssr). SSR kısmı sende hata veriyor ama client çıkıyor.
      - name: Build (allow SSR failure)
        run: npm run build || true

      - name: Verify client manifest exists
        run: |
          ls -la build || true
          ls -la build/client || true
          ls -la build/client/.vite || true
          test -f build/client/.vite/manifest.json

      - name: Generate index.html + 404.html from manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const mp = "build/client/.vite/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(mp, "utf8"));

          const keys = Object.keys(manifest);
          const entryKey = keys.find(k => /entry\.client/i.test(k)) || keys[0];
          const entryFile = manifest[entryKey].file;

          let cssFile = (manifest[entryKey].css && manifest[entryKey].css[0]) || null;
          if (!cssFile) {
            const css = fs.readdirSync("build/client/assets").find(f => f.endsWith(".css"));
            if (css) cssFile = "assets/" + css;
          }

          const entrySrc = "./" + entryFile;
          const cssHref = cssFile ? ("./" + cssFile) : "";

          const html =
            '<!doctype html><html lang="tr"><head><meta charset="UTF-8"/>' +
            '<meta name="viewport" content="width=device-width, initial-scale=1.0"/>' +
            '<title>Zermax</title>' +
            (cssHref ? `<link rel="stylesheet" href="${cssHref}"/>` : "") +
            '</head><body><div id="root"></div>' +
            `<script type="module" src="${entrySrc}"></script>` +
            '</body></html>';

          fs.writeFileSync("build/client/index.html", html);
          fs.copyFileSync("build/client/index.html", "build/client/404.html");
          console.log("Generated index.html with:", entryFile, "css:", cssFile);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
