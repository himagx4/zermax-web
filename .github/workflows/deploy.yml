name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # ✅ IMPORTANT: SSR yok. Sadece client build.
      - name: Build (GitHub Pages / client only)
        run: npm run build:pages

      # vite build çıktısı normalde dist/ olur; sende farklıysa alttaki kontrol bunu yakalar
      - name: Detect output folder
        run: |
          if [ -d "dist" ]; then
            echo "OUT_DIR=dist" >> $GITHUB_ENV
          elif [ -d "build/client" ]; then
            echo "OUT_DIR=build/client" >> $GITHUB_ENV
          else
            echo "Could not find dist or build/client"
            echo "=== repo tree (depth 3) ==="
            find . -maxdepth 3 -type d | head -n 200
            exit 1
          fi
          echo "Using OUT_DIR=$OUT_DIR"

      # SPA fallback
      - name: Add 404 fallback (SPA)
        run: |
          if [ -f "$OUT_DIR/index.html" ]; then
            cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
