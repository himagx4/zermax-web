name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build (Pages SPA)
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      # ✅ index/404 üretirken assetleri absolute yap: /assets/...
      - name: Generate index.html + 404.html from manifest
        run: node -e "const fs=require('fs'); const mp='build/client/.vite/manifest.json'; if(!fs.existsSync(mp)){console.error('Manifest not found:',mp); process.exit(1);} const m=JSON.parse(fs.readFileSync(mp,'utf8')); const keys=Object.keys(m); const entryKey=keys.find(k=>m[k]&&m[k].isEntry)||keys.find(k=>/entry\\.client/.test(k))||keys[0]; const entryFile=m[entryKey].file; let cssFile=(m[entryKey].css&&m[entryKey].css[0])||null; if(!cssFile){ const assetsDir='build/client/assets'; if(fs.existsSync(assetsDir)){ const css=fs.readdirSync(assetsDir).find(f=>f.endsWith('.css')); if(css) cssFile='assets/'+css; } } const entrySrc='/' + entryFile; const cssHref=cssFile?('/'+cssFile):''; const html='<!doctype html><html lang=\"tr\"><head><meta charset=\"UTF-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/><title>Zermax</title>'+(cssHref?('<link rel=\"stylesheet\" href=\"'+cssHref+'\"/>'):'')+'</head><body><div id=\"root\"></div><script type=\"module\" src=\"'+entrySrc+'\"></script></body></html>'; fs.writeFileSync('build/client/index.html',html); fs.copyFileSync('build/client/index.html','build/client/404.html'); console.log('Generated index.html with', entryFile, cssFile);"

      - name: Add CNAME for custom domain
        run: echo "zermax.com.tr" > build/client/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
