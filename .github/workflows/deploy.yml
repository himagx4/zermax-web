name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build (prefer client-only)
        run: |
          if npm run | grep -q "build:pages"; then
            npm run build:pages
          else
            npm run build || true
          fi

      - name: Ensure client manifest exists
        run: |
          if [ ! -f "build/client/.vite/manifest.json" ] && [ ! -f "dist/manifest.json" ] && [ ! -f "dist/.vite/manifest.json" ]; then
            echo "Manifest not found. Listing outputs:"
            find . -maxdepth 4 -type f \( -name "manifest.json" -o -name "index.html" \) | head -n 200
            exit 1
          fi

      - name: Generate index.html + 404.html from manifest (for build/client)
        run: |
          if [ -f "build/client/.vite/manifest.json" ]; then
            node -e "
              const fs=require('fs');
              const mp='build/client/.vite/manifest.json';
              const m=JSON.parse(fs.readFileSync(mp,'utf8'));
              const keys=Object.keys(m);
              const entryKey=keys.find(k=>/entry\.client/.test(k))||keys[0];
              const entryFile=m[entryKey].file;
              let cssFile=(m[entryKey].css&&m[entryKey].css[0])||null;
              if(!cssFile){
                const css=fs.readdirSync('build/client/assets').find(f=>f.endsWith('.css'));
                if(css) cssFile='assets/'+css;
              }
              const html='<!doctype html><html lang=\"tr\"><head><meta charset=\"UTF-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/><title>Zermax</title>'+(cssFile?('<link rel=\"stylesheet\" href=\"./'+cssFile+'\"/>'):'')+'</head><body><div id=\"root\"></div><script type=\"module\" src=\"./'+entryFile+'\"></script></body></html>';
              fs.writeFileSync('build/client/index.html',html);
              fs.copyFileSync('build/client/index.html','build/client/404.html');
              console.log('Generated index.html with', entryFile, cssFile);
            "
          else
            echo "No build/client manifest; skipping."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
